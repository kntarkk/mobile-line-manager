<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><title>回線マネージャー</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"></head>
<body><header><div><p class="eyebrow">MOBILE LINE MANAGER</p><h1>回線マネージャー</h1></div><button class="icon-btn" id="backupBtn" aria-label="バックアップ">⇩</button></header>
<main><section class="summary"><div><span>回線数</span><strong id="lineCount">4</strong></div><div><span>180日以上</span><strong id="over180">0</strong></div><div><span>履歴</span><strong id="historyCount">0</strong></div></section><div class="section-head"><h2>現在の回線</h2><span>タップして編集</span></div><section id="cards" class="cards"></section><section class="tools"><button id="exportBtn">バックアップを書き出す</button><label class="file-label">バックアップを復元<input id="importFile" type="file" accept=".json,application/json"></label><button id="historyBtn" class="secondary">すべての履歴を見る</button></section><p class="security">🔒 データはこのブラウザ内に保存されます。パスワードそのものは保存せず、パスワードマネージャーをご利用ください。</p></main>
<dialog id="editDialog"><form method="dialog" id="editForm"><div class="dialog-head"><div><p class="eyebrow">LINE DETAILS</p><h2 id="dialogTitle">回線1</h2></div><button value="cancel" class="close">×</button></div><input type="hidden" id="lineIndex"><label>電話番号<input id="phone" inputmode="tel" placeholder="090-1234-5678"></label><label>現在の通信会社<input id="carrier" list="carriers" placeholder="例：povo 2.0"><datalist id="carriers"><option>docomo</option><option>ahamo</option><option>au</option><option>povo 2.0</option><option>SoftBank</option><option>LINEMO</option><option>Y!mobile</option><option>楽天モバイル</option><option>UQ mobile</option><option>IIJmio</option><option>mineo</option><option>日本通信SIM</option></datalist></label><label>契約日<input id="startDate" type="date"></label><label>マイページID<input id="loginId" autocomplete="off" placeholder="メールアドレス等"></label><label>パスワード保管先<input id="passwordRef" autocomplete="off" placeholder="例：Google Password Manager"></label><label>マイページURL<input id="portalUrl" type="url" placeholder="https://..."></label><label>メモ<textarea id="memo" rows="3" placeholder="キャンペーン、端末、MNPに関するメモなど"></textarea></label><div class="dialog-actions"><button type="button" class="danger" id="mnpBtn">MNP / 乗り換え</button><button type="submit" class="primary">保存</button></div><div id="lineHistory"></div></form></dialog>
<dialog id="historyDialog"><div class="dialog-head"><div><p class="eyebrow">HISTORY</p><h2>乗り換え履歴</h2></div><button class="close" onclick="historyDialog.close()">×</button></div><div id="allHistory"></div></dialog><script src="app.js"></script></body></html>
